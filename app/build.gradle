plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.basementdragon.dietcalc'
    compileSdk 34

    defaultConfig {
        applicationId "com.basementdragon.dietcalc"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (file("release.jks").exists()) {
                storeFile file("release.jks")
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "basementdragon123!"
                keyAlias System.getenv("KEY_ALIAS") ?: "basementdragon"
                keyPassword System.getenv("KEY_PASSWORD") ?: "basementdragon123!"
            }
        }
    }

    buildTypes {
        release {
            if (file("release.jks").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
